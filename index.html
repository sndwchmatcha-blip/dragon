<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="intro" class="screen active">
    <div class="content">
        <h1>Happy Birthday</h1>
        <p>A special surprise made with love.</p>

        <button id="openButton">
            Open Gift 🎁
        </button>
    </div>
</div>

<div id="main" class="hidden">

    <header>
        <h2>Happy Birthday ❤️</h2>
    </header>

    <section class="hero">

        <img
            src="assets/photos/foto1.jpg"
            alt="Birthday">

        <h1>To Someone Special</h1>

        <p>
            Every moment with you is a beautiful memory.
        </p>

    </section>

    <section class="gallery">

        <img src="assets/photos/foto2.jpg">
        <img src="assets/photos/foto3.jpg">
        <img src="assets/photos/foto4.jpg">
        <img src="assets/photos/foto5.jpg">
        <img src="assets/photos/foto6.jpg">
        <img src="assets/photos/foto7.jpg">

    </section>

    <section class="message">

        <h2>My Wishes</h2>

        <p id="typing"></p>

    </section>

</div>

<audio
id="music"
loop
src="assets/music/music.mp3">
</audio>

<script src="script.js"></script>

</body>
</html>
